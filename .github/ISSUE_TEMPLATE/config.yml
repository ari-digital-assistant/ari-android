blank_issues_enabled: false

# The in-app reporter goes first on purpose: for anyone on a testing build it
# is a strictly better route than the form below, and the form's own questions
# are the ones it answers automatically.

contact_links:
  - name: Report a bug from inside Ari
    url: https://github.com/ari-digital-assistant/ari-android#reporting-bugs
    about: >-
      On a testing build, the bug report button in the app collects your
      versions, device details and logs automatically. Much faster than
      filling in a form.
  - name: Something wrong with a skill
    url: https://github.com/ari-digital-assistant/ari-skills/issues/new/choose
    about: Skills live in their own repository.
  - name: Questions and ideas
    url: https://github.com/orgs/ari-digital-assistant/discussions
    about: For anything that isn't a bug.
